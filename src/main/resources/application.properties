spring.application.name=outcome-escrow
management.endpoints.web.exposure.include=health,info

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/outcomeescrow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:outcome}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.enabled=true

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew check --no-daemon

  publish-image:
    name: build and push image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mikeylikesit0475/outcome-escrow:${{ github.ref_name }}
            ghcr.io/mikeylikesit0475/outcome-escrow:sha-${{ steps.sha.outputs.short }}
            ghcr.io/mikeylikesit0475/outcome-escrow:latest

  github-release:
    name: create GitHub release
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" --generate-notes --verify-tag

  smoke-deploy:
    name: smoke deploy
    needs: [publish-image, github-release]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Pull image
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi
          docker pull "ghcr.io/mikeylikesit0475/outcome-escrow:$TAG"
      - name: Run released image
        run: |
          docker run -d --name outcome-escrow --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/postgres \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            "ghcr.io/mikeylikesit0475/outcome-escrow:$TAG"
      - name: Poll health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "health UP after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "health never came up"
          docker logs outcome-escrow || true
          exit 1
      - name: Verify contracts endpoint
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/contracts >/dev/null
      - name: Stop container
        if: always()
        run: docker rm -f outcome-escrow || true

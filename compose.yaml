services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outcomeescrow}
      POSTGRES_USER: ${POSTGRES_USER:-outcome}
      # Local development only. Override POSTGRES_PASSWORD in every non-local environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outcome-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outcome} -d ${POSTGRES_DB:-outcomeescrow}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-outcomeescrow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-outcome}
      # Change this for any deployment handling real data.
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-outcome-dev-only}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

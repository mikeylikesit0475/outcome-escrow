services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: outcomeescrow
      POSTGRES_USER: outcome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcome -d outcomeescrow"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/outcomeescrow
      SPRING_DATASOURCE_USERNAME: outcome
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
